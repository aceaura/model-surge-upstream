services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: msu
      POSTGRES_PASSWORD: ${MSU_PG_PASSWORD:-msu}
      POSTGRES_DB: msu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msu -d msu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MSU_PG_DSN: postgres://msu:${MSU_PG_PASSWORD:-msu}@postgres:5432/msu?sslmode=disable
      MSU_REDIS_ADDR: redis:6379
      # 密钥必须从环境传入，无默认值：缺失时服务启动即失败。
      MSU_ADMIN_KEY: ${MSU_ADMIN_KEY:?MSU_ADMIN_KEY is required}
      MSU_DELIVERY_KEY: ${MSU_DELIVERY_KEY:?MSU_DELIVERY_KEY is required}
      MSU_LISTEN: ":8080"
      # 百炼 CLI config 直读:bl 撞过期自动续期写回该文件,额度查询优先
      # 取其中 access_token,免去人工重导。宿主路径可用 MSU_BAILIAN_CLI_DIR
      # 覆盖,默认 Windows 本机位置。
      MSU_BAILIAN_CLI_CONFIG: /run/bailian-cli/config.json
    volumes:
      - ${MSU_BAILIAN_CLI_DIR:-C:/Users/User/.bailian}:/run/bailian-cli:ro
    ports:
      - "8080:8080"
      # 代理转发面默认端口。该端口运行期可在管理面修改；改成非默认值时
      # 须同步调整此映射。注意容器内 127.0.0.1 不等于宿主机回环——
      # 要从容器外访问转发面，须在管理面开启「开放局域网访问」。
      - "12345:12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
